<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에디핏 | EDIFIT MoneyFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2130;
    --surface3: #252a3a;
    --border: #2a3048;
    --accent: #4f9eff;
    --accent2: #7c6fff;
    --green: #3ecf8e;
    --red: #f66;
    --yellow: #f5c842;
    --orange: #ff9540;
    --text: #e8eaf0;
    --text2: #8891aa;
    --text3: #555d78;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.5px;
  }
  .logo-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
  }
  .logo-sub { color: var(--text2); font-weight: 400; font-size: 13px; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    padding: 4px;
    border-radius: 10px;
  }
  .tab-btn {
    padding: 8px 20px;
    border: none;
    background: transparent;
    color: var(--text2);
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--surface3);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* ── PAGE ── */
  .page { display: none; padding: 28px; max-width: 1400px; margin: 0 auto; }
  .page.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  /* ── DASHBOARD ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .stat-card.blue::before { background: var(--accent); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.red::before { background: var(--red); }
  .stat-card.yellow::before { background: var(--yellow); }
  .stat-card.purple::before { background: var(--accent2); }
  .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; font-weight: 500; }
  .stat-value { font-size: 24px; font-weight: 800; font-family: 'Space Mono', monospace; }
  .stat-value.blue { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.yellow { color: var(--yellow); }
  .stat-value.purple { color: var(--accent2); }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* ── PIPELINE ── */
  .pipeline-stages {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 24px;
  }
  .stage-col {
    flex: 0 0 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .stage-header {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .stage-count {
    margin-left: auto;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 11px;
  }
  .stage-body { padding: 10px; min-height: 80px; display: flex; flex-direction: column; gap: 8px; }
  .site-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .site-chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .site-chip-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .site-chip-sub { font-size: 11px; color: var(--text2); }
  .site-chip-company { font-size: 11px; color: var(--accent); }

  /* stage colors */
  .s0 .stage-header { background: rgba(100,116,139,0.15); color: #94a3b8; }
  .s0 .stage-dot { background: #94a3b8; }
  .s1 .stage-header { background: rgba(79,158,255,0.15); color: var(--accent); }
  .s1 .stage-dot { background: var(--accent); }
  .s2 .stage-header { background: rgba(124,111,255,0.15); color: var(--accent2); }
  .s2 .stage-dot { background: var(--accent2); }
  .s3 .stage-header { background: rgba(255,149,64,0.15); color: var(--orange); }
  .s3 .stage-dot { background: var(--orange); }
  .s4 .stage-header { background: rgba(62,207,142,0.15); color: var(--green); }
  .s4 .stage-dot { background: var(--green); }
  .s5 .stage-header { background: rgba(246,102,102,0.15); color: var(--red); }
  .s5 .stage-dot { background: var(--red); }

  /* ── FORM ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .form-full { grid-column: 1/-1; }
  label { font-size: 12px; color: var(--text2); font-weight: 600; display: block; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    transition: border 0.2s;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--text3); }
  select option { background: var(--surface2); }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3b8fe0; }
  .btn-success { background: var(--green); color: #000; }
  .btn-success:hover { background: #35ba7d; }
  .btn-danger { background: var(--red); color: #fff; font-size: 12px; padding: 6px 14px; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ── SECTION TABS (INPUT PAGE) ── */
  .section-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .sec-tab {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.2s;
  }
  .sec-tab.active { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  /* ── TABLE ── */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px 14px;
    font-size: 13px;
    border-bottom: 1px solid rgba(42,48,72,0.5);
  }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-green { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge-red { background: rgba(246,102,102,0.15); color: var(--red); }
  .badge-yellow { background: rgba(245,200,66,0.15); color: var(--yellow); }
  .badge-blue { background: rgba(79,158,255,0.15); color: var(--accent); }
  .badge-gray { background: rgba(136,145,170,0.15); color: var(--text2); }
  .badge-orange { background: rgba(255,149,64,0.15); color: var(--orange); }

  /* ── SITE DETAIL (현장 탭) ── */
  .site-detail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .margin-ring {
    width: 80px; height: 80px;
    position: relative;
    flex-shrink: 0;
  }
  .margin-ring svg { width: 80px; height: 80px; transform: rotate(-90deg); }
  .margin-ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    color: var(--green);
    font-family: 'Space Mono', monospace;
  }

  .cost-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .cost-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .cost-item-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .cost-item-value { font-size: 16px; font-weight: 700; font-family: 'Space Mono', monospace; }

  /* ── CALENDAR ── */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .cal-nav { display: flex; align-items: center; gap: 16px; }
  .cal-month { font-size: 20px; font-weight: 800; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day-header {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    padding: 8px;
    text-transform: uppercase;
  }
  .cal-day {
    min-height: 80px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    position: relative;
  }
  .cal-day.other-month { opacity: 0.3; }
  .cal-day.today { border-color: var(--accent); }
  .cal-day-num {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .cal-day.today .cal-day-num { color: var(--accent); }
  .leave-chip {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  /* Team colors */
  .team-prod { background: rgba(79,158,255,0.25); color: #7cbfff; }
  .team-design { background: rgba(124,111,255,0.25); color: #a89fff; }
  .team-install { background: rgba(255,149,64,0.25); color: #ffb074; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── MISC ── */
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .section { margin-bottom: 28px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }
  .mono { font-family: 'Space Mono', monospace; }
  .text-green { color: var(--green); }
  .text-red { color: var(--red); }
  .text-yellow { color: var(--yellow); }
  .text-blue { color: var(--accent); }
  .text-sm { font-size: 12px; }
  .text-xs { font-size: 11px; color: var(--text2); }
  .fw-bold { font-weight: 700; }

  .toggle-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .toggle-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .toggle-chip.active {
    border-color: var(--accent);
    background: rgba(79,158,255,0.15);
    color: var(--accent);
  }

  /* ── NOTIFICATION ── */
  .notif {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface3);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .notif.show { transform: translateY(0); opacity: 1; }
  .notif.error { border-color: var(--red); color: var(--red); }

  .actions-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  @media (max-width: 768px) {
    .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
    .form-full { grid-column: 1; }
    .topbar { flex-wrap: wrap; gap: 12px; }
    .tabs { flex-wrap: wrap; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <span class="logo-badge">EDIFIT</span>
    <span class="logo-sub">가구 공장 머니플로우</span>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard')">📊 대시보드</button>
    <button class="tab-btn" onclick="switchTab('input')">✏️ 입력</button>
    <button class="tab-btn" onclick="switchTab('sites')">🏢 현장</button>
    <button class="tab-btn" onclick="switchTab('calendar')">📅 달력</button>
  </div>
</div>

<!-- ════════════════════════════════════════
     TAB 1: DASHBOARD
════════════════════════════════════════ -->
<div id="tab-dashboard" class="page active">
  <!-- Stats Row -->
  <div class="stats-grid" id="stat-cards"></div>

  <!-- Pipeline -->
  <div class="section">
    <div class="card-title" style="margin-bottom:16px;">📋 현장 공정 현황</div>
    <div class="pipeline-stages" id="pipeline-board"></div>
  </div>

  <!-- Recent activity -->
  <div class="section">
    <div class="card">
      <div class="card-title">🕐 최근 거래 내역</div>
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>현장명</th>
            <th>유형</th>
            <th>금액</th>
            <th>세금계산서</th>
            <th>메모</th>
          </tr>
        </thead>
        <tbody id="recent-table"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════
     TAB 2: INPUT
════════════════════════════════════════ -->
<div id="tab-input" class="page">
  <div class="row" style="margin-bottom:20px;">
    <div class="section-tabs">
      <button class="sec-tab active" onclick="switchSec('매출')">💰 매출</button>
      <button class="sec-tab" onclick="switchSec('매입')">📦 매입</button>
      <button class="sec-tab" onclick="switchSec('AS')">🔧 AS</button>
      <button class="sec-tab" onclick="switchSec('현장등록')">🏗️ 현장등록</button>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary btn-sm" onclick="openAddSiteModal()">+ 현장 추가</button>
  </div>

  <!-- 매출 입력 -->
  <div id="sec-매출" class="card">
    <div class="card-title">💰 매출 입력</div>
    <div class="form-grid">
      <div>
        <label>현장 선택 *</label>
        <select id="out-site"></select>
      </div>
      <div>
        <label>날짜 *</label>
        <input type="date" id="out-date">
      </div>
      <div>
        <label>매출 금액 (원) *</label>
        <input type="text" id="out-amount" placeholder="예) 5,000,000" oninput="formatNum(this)">
      </div>
      <div>
        <label>입금 여부</label>
        <select id="out-paid">
          <option value="미입금">미입금</option>
          <option value="입금완료">입금완료</option>
          <option value="부분입금">부분입금</option>
        </select>
      </div>
      <div>
        <label>세금계산서 발행 여부</label>
        <select id="out-tax">
          <option value="미발행">미발행</option>
          <option value="발행완료">발행완료</option>
          <option value="발행예정">발행예정</option>
        </select>
      </div>
      <div>
        <label>세금계산서 발행일</label>
        <input type="date" id="out-tax-date">
      </div>
      <div class="form-full">
        <label>메모</label>
        <input type="text" id="out-memo" placeholder="특이사항, 계약금/중도금/잔금 등">
      </div>
    </div>
    <div class="actions-row">
      <button class="btn btn-success" onclick="saveTransaction('매출')">💰 매출 저장</button>
    </div>

    <hr class="divider">
    <div class="card-title">저장된 매출</div>
    <table>
      <thead>
        <tr><th>날짜</th><th>현장</th><th>금액</th><th>입금</th><th>세금계산서</th><th>메모</th><th></th></tr>
      </thead>
      <tbody id="out-list"></tbody>
    </table>
  </div>

  <!-- 매입 입력 -->
  <div id="sec-매입" class="card" style="display:none;">
    <div class="card-title">📦 매입 입력</div>
    <div class="form-grid">
      <div>
        <label>현장 선택 *</label>
        <select id="in-site"></select>
      </div>
      <div>
        <label>날짜 *</label>
        <input type="date" id="in-date">
      </div>
      <div>
        <label>매입 금액 (원) *</label>
        <input type="text" id="in-amount" placeholder="예) 2,000,000" oninput="formatNum(this)">
      </div>
      <div>
        <label>매입 유형</label>
        <select id="in-type">

<script>
// ═══════════════════════════════════════════
//  DATA LAYER (localStorage)
// ═══════════════════════════════════════════
const KEYS = {
  sites: 'ef_sites',
  txs: 'ef_txs',
  leaves: 'ef_leaves'
};

function load(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } }
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

let sites = load(KEYS.sites);
let txs = load(KEYS.txs);
let leaves = load(KEYS.leaves);

// seed demo data if empty
if (!sites.length) {
  sites = [
    { id: uid(), name: '강남구 역삼동 OO사무소', company: '현대인테리어', stage: '2', date: '2025-05-01', craft: 4, plywood: 350000, memo: '' },
    { id: uid(), name: '서초구 잠원동 APT', company: '리브인테리어', stage: '1', date: '2025-05-10', craft: 2, plywood: 180000, memo: '' },
    { id: uid(), name: '마포구 합정동 카페', company: '스페이스랩', stage: '3', date: '2025-04-20', craft: 6, plywood: 520000, memo: 'AS 중' },
    { id: uid(), name: '송파구 잠실동 상가', company: '디자인그룹', stage: '0', date: '2025-05-15', craft: 0, plywood: 0, memo: '실측 예정' },
  ];
  save(KEYS.sites, sites);
}
if (!txs.length) {
  const s0 = sites[0].id, s1 = sites[1].id, s2 = sites[2].id;
  txs = [
    { id: uid(), type: '매출', siteId: s0, date: '2025-05-05', amount: 8500000, paid: '입금완료', tax: '발행완료', taxDate: '2025-05-05', vendor: '', memo: '계약금', typeDetail: '' },
    { id: uid(), type: '매출', siteId: s0, date: '2025-05-15', amount: 4000000, paid: '미입금', tax: '미발행', taxDate: '', vendor: '', memo: '중도금 예정', typeDetail: '' },
    { id: uid(), type: '매입', siteId: s0, date: '2025-05-06', amount: 2800000, paid: '지급완료', tax: '수취완료', taxDate: '2025-05-06', vendor: '목재사', memo: '자재', typeDetail: '자재비' },
    { id: uid(), type: '매입', siteId: s0, date: '2025-05-07', amount: 380000, paid: '지급완료', tax: '수취완료', taxDate: '2025-05-07', vendor: '합판거래처', memo: '합판', typeDetail: '합판비' },
    { id: uid(), type: '매출', siteId: s1, date: '2025-05-12', amount: 3200000, paid: '입금완료', tax: '발행완료', taxDate: '2025-05-12', vendor: '', memo: '선금', typeDetail: '' },
    { id: uid(), type: '매입', siteId: s1, date: '2025-05-13', amount: 1100000, paid: '미지급', tax: '미수취', taxDate: '', vendor: '부자재상', memo: '자재', typeDetail: '자재비' },
    { id: uid(), type: 'AS', siteId: s2, date: '2025-05-18', amount: 120000, paid: '', tax: '', taxDate: '', vendor: '', memo: '도어 힌지 교체', typeDetail: '자체처리' },
  ];
  save(KEYS.txs, txs);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ═══════════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════════
const STAGE_LABELS = ['실측', '도면제작', '시공', 'AS', '완료'];
const STAGE_CLASSES = ['s0','s1','s2','s3','s4'];
const STAGE_EMOJI = ['📐','📝','🔨','🔧','✅'];

function switchTab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const idx = ['dashboard','input','sites','calendar'].indexOf(name);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');

  if (name === 'dashboard') renderDashboard();
  if (name === 'input') renderInput();
  if (name === 'sites') renderSites();
  if (name === 'calendar') renderCalendar();
}

function switchSec(name) {
  document.querySelectorAll('.sec-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('[id^="sec-"]').forEach(d => d.style.display = 'none');
  event.currentTarget.classList.add('active');
  document.getElementById('sec-' + name).style.display = 'block';
  if (name === '현장등록') renderSiteListTable();
}

// ═══════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════
function renderDashboard() {
  // Stats
  const totalOut = txs.filter(t => t.type === '매출').reduce((a,t) => a + t.amount, 0);
  const totalIn  = txs.filter(t => t.type === '매입').reduce((a,t) => a + t.amount, 0);
  const totalAS  = txs.filter(t => t.type === 'AS').reduce((a,t) => a + t.amount, 0);
  const profit   = totalOut - totalIn - totalAS;
  const margin   = totalOut > 0 ? Math.round(profit / totalOut * 100) : 0;
  const unpaidTax = txs.filter(t => t.type === '매출' && t.tax !== '발행완료').reduce((a,t) => a + t.amount, 0);

  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card green">
      <div class="stat-label">총 매출</div>
      <div class="stat-value green">${fmt(totalOut)}</div>
      <div class="stat-sub">원</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">총 매입</div>
      <div class="stat-value red">${fmt(totalIn)}</div>
      <div class="stat-sub">원</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">순이익</div>
      <div class="stat-value blue">${fmt(profit)}</div>
      <div class="stat-sub">매출 - 매입 - AS</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">이익률</div>
      <div class="stat-value yellow">${margin}%</div>
      <div class="stat-sub">목표 30%</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-label">세금계산서 미발행</div>
      <div class="stat-value purple">${fmt(unpaidTax)}</div>
      <div class="stat-sub">미발행 매출 합계</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">AS 비용</div>
      <div class="stat-value red">${fmt(totalAS)}</div>
      <div class="stat-sub">원</div>
    </div>
  `;

  // Pipeline
  const stages = [0,1,2,3,4];
  const board = document.getElementById('pipeline-board');
  board.innerHTML = stages.map(i => {
    const stageSites = sites.filter(s => s.stage == i);
    const chips = stageSites.map(s => {
      const sOut = txs.filter(t => t.type === '매출' && t.siteId === s.id).reduce((a,t) => a+t.amount, 0);
      return `<div class="site-chip" onclick="switchTab('sites')">
        <div class="site-chip-name">${s.name}</div>
        <div class="site-chip-company">${s.company}</div>
        <div class="site-chip-sub">${sOut ? '매출 ' + fmt(sOut) + '원' : '미입력'}</div>
      </div>`;
    }).join('');
    return `<div class="stage-col s${i}">
      <div class="stage-header">
        <span class="stage-dot"></span>${STAGE_EMOJI[i]} ${STAGE_LABELS[i]}
        <span class="stage-count">${stageSites.length}</span>
      </div>
      <div class="stage-body">${chips || '<div class="empty" style="padding:16px;font-size:11px;">현장 없음</div>'}</div>
    </div>`;
  }).join('');

  // Recent
  const recent = [...txs].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 10);
  const tb = document.getElementById('recent-table');
  if (!recent.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">거래 내역이 없습니다.</td></tr>'; return; }
  tb.innerHTML = recent.map(t => {
    const site = sites.find(s => s.id === t.siteId);
    const typeBadge = t.type === '매출' ? 'badge-green' : t.type === '매입' ? 'badge-blue' : 'badge-red';
    const taxVal = t.type === '매출' ? t.tax : t.tax;
    const taxBadge = taxVal === '발행완료' || taxVal === '수취완료' ? 'badge-green' : taxVal === '발행예정' || taxVal === '수취예정' ? 'badge-yellow' : 'badge-gray';
    return `<tr>
      <td class="mono text-xs">${t.date}</td>
      <td>${site ? site.name : '-'}</td>
      <td><span class="badge ${typeBadge}">${t.type}</span></td>
      <td class="mono fw-bold">${fmt(t.amount)}원</td>
      <td><span class="badge ${taxBadge}">${taxVal || '-'}</span></td>
      <td class="text-xs" style="color:var(--text2)">${t.memo || '-'}</td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════
//  INPUT PAGE
// ═══════════════════════════════════════════
function renderInput() {
  populateSiteSelects();
  renderTxList('매출');
  renderTxList('매입');
  renderTxList('AS');
  // set today
  const today = new Date().toISOString().slice(0,10);
  ['out-date','in-date','as-date'].forEach(id => { const el = document.getElementById(id); if (!el.value) el.value = today; });
}

function populateSiteSelects() {
  const opts = '<option value="">-- 선택 --</option>' + sites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  ['out-site','in-site','as-site'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });
}

function renderTxList(type) {
  const list = txs.filter(t => t.type === type).sort((a,b) => b.date.localeCompare(a.date));
  let tbId = type === '매출' ? 'out-list' : type === '매입' ? 'in-list' : 'as-list';
  const tb = document.getElementById(tbId);
  if (!tb) return;
  if (!list.length) { tb.innerHTML = '<tr><td colspan="8" class="empty">없음</td></tr>'; return; }

  if (type === '매출') {
    tb.innerHTML = list.map(t => {
      const site = sites.find(s => s.id === t.siteId);
      const paidBadge = t.paid === '입금완료' ? 'badge-green' : t.paid === '부분입금' ? 'badge-yellow' : 'badge-gray';
      const taxBadge = t.tax === '발행완료' ? 'badge-green' : t.tax === '발행예정' ? 'badge-yellow' : 'badge-red';
      return `<tr>
        <td class="mono text-xs">${t.date}</td>
        <td>${site ? site.name : '-'}</td>
        <td class="mono fw-bold text-green">${fmt(t.amount)}원</td>
        <td><span class="badge ${paidBadge}">${t.paid}</span></td>
        <td><span class="badge ${taxBadge}">${t.tax}</span>${t.taxDate ? `<div class="text-xs" style="margin-top:2px">${t.taxDate}</div>` : ''}</td>
        <td class="text-xs">${t.memo || '-'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteTx('${t.id}')">삭제</button></td>
      </tr>`;
    }).join('');
  } else if (type === '매입') {
    tb.innerHTML = list.map(t => {
      const site = sites.find(s => s.id === t.siteId);
      const paidBadge = t.paid === '지급완료' ? 'badge-green' : t.paid === '부분지급' ? 'badge-yellow' : 'badge-red';
      const taxBadge = t.tax === '수취완료' ? 'badge-green' : t.tax === '수취예정' ? 'badge-yellow' : 'badge-gray';
      return `<tr>
        <td class="mono text-xs">${t.date}</td>
        <td>${site ? site.name : '-'}</td>
        <td><span class="badge badge-blue">${t.typeDetail}</span></td>
        <td class="mono fw-bold text-red">${fmt(t.amount)}원</td>
        <td><span class="badge ${paidBadge}">${t.paid}</span></td>
        <td><span class="badge ${taxBadge}">${t.tax}</span>${t.taxDate ? `<div class="text-xs" style="margin-top:2px">${t.taxDate}</div>` : ''}</td>
        <td class="text-xs">${t.vendor || '-'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteTx('${t.id}')">삭제</button></td>
      </tr>`;
    }).join('');
  } else {
    tb.innerHTML = list.map(t => {
      const site = sites.find(s => s.id === t.siteId);
      return `<tr>
        <td class="mono text-xs">${t.date}</td>
        <td>${site ? site.name : '-'}</td>
        <td><span class="badge badge-orange">${t.typeDetail}</span></td>
        <td class="mono fw-bold text-red">${fmt(t.amount)}원</td>
        <td class="text-xs">${t.memo || '-'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteTx('${t.id}')">삭제</button></td>
      </tr>`;
    }).join('');
  }
}

function saveTransaction(type) {
  let tx = { id: uid(), type };
  if (type === '매출') {
    const siteId = document.getElementById('out-site').value;
    const amount = parseRaw(document.getElementById('out-amount').value);
    if (!siteId || !amount) return notify('현장과 금액을 입력하세요.', true);
    tx = { ...tx, siteId, date: document.getElementById('out-date').value, amount,
      paid: document.getElementById('out-paid').value, tax: document.getElementById('out-tax').value,
      taxDate: document.getElementById('out-tax-date').value, memo: document.getElementById('out-memo').value,
      vendor: '', typeDetail: '' };
    document.getElementById('out-amount').value = '';
    document.getElementById('out-memo').value = '';
  } else if (type === '매입') {
    const siteId = document.getElementById('in-site').value;
    const amount = parseRaw(document.getElementById('in-amount').value);
    if (!siteId || !amount) return notify('현장과 금액을 입력하세요.', true);
    tx = { ...tx, siteId, date: document.getElementById('in-date').value, amount,
      paid: document.getElementById('in-paid').value, tax: document.getElementById('in-tax').value,
      taxDate: document.getElementById('in-tax-date').value, vendor: document.getElementById('in-vendor').value,
      memo: document.getElementById('in-memo').value, typeDetail: document.getElementById('in-type').value };
    document.getElementById('in-amount').value = '';
    document.getElementById('in-memo').value = '';
    document.getElementById('in-vendor').value = '';
  } else {
    const siteId = document.getElementById('as-site').value;
    const amount = parseRaw(document.getElementById('as-amount').value);
    if (!siteId || !amount) return notify('현장과 금액을 입력하세요.', true);
    tx = { ...tx, siteId, date: document.getElementById('as-date').value, amount,
      paid: '', tax: '', taxDate: '', vendor: '',
      memo: document.getElementById('as-memo').value, typeDetail: document.getElementById('as-type').value };
    document.getElementById('as-amount').value = '';
    document.getElementById('as-memo').value = '';
  }
  txs.push(tx);
  save(KEYS.txs, txs);
  renderTxList(type);
  notify('저장되었습니다 ✓');
}

function deleteTx(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  txs = txs.filter(t => t.id !== id);
  save(KEYS.txs, txs);
  renderTxList('매출'); renderTxList('매입'); renderTxList('AS');
  notify('삭제되었습니다.');
}

function renderSiteListTable() {
  const tb = document.getElementById('site-list-table');
  if (!sites.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">등록된 현장이 없습니다.</td></tr>'; return; }
  tb.innerHTML = sites.map(s => `<tr>
    <td>${s.name}</td>
    <td>${s.company}</td>
    <td class="mono text-xs">${s.date}</td>
    <td>${STAGE_EMOJI[s.stage]} ${STAGE_LABELS[s.stage]}</td>
    <td></td>
    <td>
      <select onchange="updateSiteStage('${s.id}', this.value)" style="padding:4px 8px; font-size:12px;">
        ${STAGE_LABELS.map((l,i) => `<option value="${i}" ${s.stage == i ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <button class="btn btn-danger btn-sm" style="margin-left:6px" onclick="deleteSite('${s.id}')">삭제</button>
    </td>
  </tr>`).join('');
}

function updateSiteStage(id, stage) {
  const s = sites.find(s => s.id === id);
  if (s) { s.stage = stage; save(KEYS.sites, sites); notify('단계 업데이트 ✓'); }
}

function deleteSite(id) {
  if (!confirm('현장을 삭제하시겠습니까? 관련 거래 내역은 유지됩니다.')) return;
  sites = sites.filter(s => s.id !== id);
  save(KEYS.sites, sites);
  renderSiteListTable();
  notify('삭제되었습니다.');
}

// ═══════════════════════════════════════════
//  SITES PAGE
// ═══════════════════════════════════════════
function renderSites() {
  const search = document.getElementById('site-search').value.toLowerCase();
  const grid = document.getElementById('sites-grid');

  const filtered = sites.filter(s => s.name.toLowerCase().includes(search) || s.company.toLowerCase().includes(search));

  if (!filtered.length) { grid.innerHTML = '<div class="empty card">현장이 없습니다.</div>'; return; }

  grid.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;">` +
    filtered.map(s => {
      const sOut = txs.filter(t => t.type === '매출' && t.siteId === s.id).reduce((a,t) => a+t.amount,0);
      const sIn  = txs.filter(t => t.type === '매입' && t.siteId === s.id).reduce((a,t) => a+t.amount,0);
      const sAS  = txs.filter(t => t.type === 'AS' && t.siteId === s.id).reduce((a,t) => a+t.amount,0);
      const sMatl = txs.filter(t => t.type === '매입' && t.siteId === s.id && t.typeDetail === '자재비').reduce((a,t) => a+t.amount,0);
      const sPlyw = txs.filter(t => t.type === '매입' && t.siteId === s.id && t.typeDetail === '합판비').reduce((a,t) => a+t.amount,0) + (s.plywood || 0);
      const profit = sOut - sIn - sAS;
      const margin = sOut > 0 ? Math.round(profit / sOut * 100) : 0;
      const marginColor = margin >= 30 ? 'var(--green)' : margin >= 20 ? 'var(--yellow)' : 'var(--red)';
      const dashArray = 220;
      const dashOffset = dashArray - (dashArray * Math.max(0, Math.min(margin, 100)) / 100);
      const taxUnissued = txs.filter(t => t.type === '매출' && t.siteId === s.id && t.tax !== '발행완료').length;

      return `<div class="card" style="position:relative;">
        <div class="site-detail-header">
          <div>
            <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${s.name}</div>
            <div style="font-size:12px;color:var(--accent)">${s.company}</div>
            <div style="margin-top:8px;">
              <span class="badge badge-${s.stage==4?'green':s.stage==3?'orange':'blue'}">${STAGE_EMOJI[s.stage]} ${STAGE_LABELS[s.stage]}</span>
              ${taxUnissued > 0 ? `<span class="badge badge-yellow" style="margin-left:6px;">⚠ 미발행 ${taxUnissued}건</span>` : ''}
            </div>
          </div>
          <div class="margin-ring">
            <svg viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="35" fill="none" stroke="var(--surface3)" stroke-width="7"/>
              <circle cx="40" cy="40" r="35" fill="none" stroke="${marginColor}" stroke-width="7"
                stroke-dasharray="${dashArray}" stroke-dashoffset="${dashOffset}" stroke-linecap="round"/>
            </svg>
            <div class="margin-ring-text" style="color:${marginColor}">${margin}%</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">
          <div class="cost-item">
            <div class="cost-item-label">매출</div>
            <div class="cost-item-value text-green">${fmtShort(sOut)}</div>
          </div>
          <div class="cost-item">
            <div class="cost-item-label">매입</div>
            <div class="cost-item-value text-red">${fmtShort(sIn)}</div>
          </div>
          <div class="cost-item">
            <div class="cost-item-label">순이익</div>
            <div class="cost-item-value" style="color:${marginColor}">${fmtShort(profit)}</div>
          </div>
        </div>

        <div style="font-size:11px;color:var(--text2);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">세부 비용</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="cost-item">
            <div class="cost-item-label">🪵 자재비</div>
            <div class="cost-item-value" style="font-size:14px;">${fmt(sMatl)}원</div>
          </div>
          <div class="cost-item">
            <div class="cost-item-label">🪵 합판비</div>
            <div class="cost-item-value" style="font-size:14px;">${fmt(sPlyw)}원</div>
          </div>
          <div class="cost-item">
            <div class="cost-item-label">🔨 시공 품</div>
            <div class="cost-item-value" style="font-size:14px;">${s.craft || 0} 품</div>
          </div>
          <div class="cost-item">
            <div class="cost-item-label">🔧 AS 비용</div>
            <div class="cost-item-value text-red" style="font-size:14px;">${fmt(sAS)}원</div>
          </div>
        </div>

        <div style="margin-top:12px;display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="editSiteStageUI('${s.id}')">단계 변경</button>
        </div>
      </div>`;
    }).join('') + '</div>';
}

function editSiteStageUI(id) {
  const s = sites.find(x => x.id === id);
  if (!s) return;
  const val = prompt(`현재 단계: ${STAGE_LABELS[s.stage]}\n새 단계 번호 입력 (0=실측, 1=도면제작, 2=시공, 3=AS, 4=완료):`);
  if (val === null) return;
  const n = parseInt(val);
  if (isNaN(n) || n < 0 || n > 4) return notify('0~4 숫자를 입력하세요.', true);
  s.stage = n; save(KEYS.sites, sites);
  renderSites(); notify('단계 업데이트 ✓');
}

document.getElementById('site-search').addEventListener('input', renderSites);

// ═══════════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════════
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function renderCalendar() {
  const now = new Date();
  document.getElementById('cal-month-label').textContent = `${calYear}년 ${calMonth + 1}월`;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  const grid = document.getElementById('cal-grid');
  const dayHeaders = ['일','월','화','수','목','금','토'];
  let html = dayHeaders.map(d => `<div class="cal-day-header">${d}</div>`).join('');

  // prev month padding
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${prevDays - i}</div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d === now.getDate() && calMonth === now.getMonth() && calYear === now.getFullYear();
    const dayLeaves = leaves.filter(l => l.start <= dateStr && l.end >= dateStr);
    const chips = dayLeaves.map(l => {
      const cls = l.team === '생산직' ? 'team-prod' : l.team === '디자인팀' ? 'team-design' : 'team-install';
      return `<div class="leave-chip ${cls}" title="${l.name} (${l.type})">${l.name} ${l.type}</div>`;
    }).join('');
    html += `<div class="cal-day${isToday ? ' today' : ''}">
      <div class="cal-day-num">${d}</div>
      ${chips}
    </div>`;
  }

  // fill remainder
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  }

  grid.innerHTML = html;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function saveLeave() {
  const name = document.getElementById('lv-name').value.trim();
  const team = document.getElementById('lv-team').value;
  const type = document.getElementById('lv-type').value;
  const start = document.getElementById('lv-start').value;
  const end = document.getElementById('lv-end').value;
  if (!name || !start || !end) return notify('이름, 시작일, 종료일을 입력하세요.', true);
  if (start > end) return notify('시작일이 종료일보다 늦습니다.', true);
  leaves.push({ id: uid(), name, team, type, start, end, memo: document.getElementById('lv-memo').value });
  save(KEYS.leaves, leaves);
  closeModal('modal-leave');
  renderCalendar();
  notify('등록되었습니다 ✓');
}

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function fmt(n) { return (n || 0).toLocaleString('ko-KR'); }
function fmtShort(n) {
  if (Math.abs(n) >= 100000000) return (n/100000000).toFixed(1) + '억';
  if (Math.abs(n) >= 10000) return (n/10000).toFixed(0) + '만';
  return n.toLocaleString();
}
function formatNum(el) {
  const raw = el.value.replace(/[^0-9]/g, '');
  el.value = raw ? parseInt(raw).toLocaleString('ko-KR') : '';
}
function parseRaw(s) { return parseInt((s || '0').replace(/[^0-9]/g, '')) || 0; }

function notify(msg, err = false) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.toggle('error', err);
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// Modal close on overlay click
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});
